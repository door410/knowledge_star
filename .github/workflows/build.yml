# 推送到 main 後：測試 → 做 Android 和 Windows 安裝檔 → 放到 Releases
# 實際步驟都在 scripts/ci/*.sh，平常不用改這個檔
name: 測試與建置

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION_NAME: 1.0.${{ github.run_number }}
  APP_VERSION_CODE: ${{ github.run_number }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: 自動測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: bash scripts/ci/test.sh

  windows:
    name: Windows 安裝檔
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: bash scripts/ci/windows.sh
        env:
          GOOGLE_DESKTOP_ID: ${{ secrets.GOOGLE_DESKTOP_ID }}
          GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}
      - uses: actions/upload-artifact@v5
        with: { name: windows, path: out/, retention-days: 30 }

  android:
    name: Android 安裝檔
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: bash scripts/ci/android.sh
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v5
        with: { name: android, path: out/, retention-days: 30 }

  release:
    name: 發佈安裝檔
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { path: out, merge-multiple: true }
      - run: bash scripts/ci/release.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
