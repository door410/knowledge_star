<style>
:root{--fg:#ddd;--sub:#888;--panel:#0d0e10ee;--line:#ffffff22;--chip:#111a;--chipOn:#eee;--chipOnFg:#000}

@media(max-width:640px){#card{left:8px;right:8px;width:auto;top:auto;bottom:8px;height:55vh}}
</style></head><body>
<canvas id="cv"></canvas>
<div id="ui">
 <div class="g" id="gMode"><button class="c" data-v="star">壯麗星空</button><button class="c" data-v="min">簡約</button></div>
 <div class="g s"><label>星點顏色<input type="color" id="starC"></label><label>選取色<input type="color" id="starHi"></label></div>
 <div class="g m" id="gBg"><b>底色</b><button class="c" data-v="dark">黑</button><button class="c" data-v="light">白</button></div>
 <div class="g m" id="gCol"><b>點色</b><button class="c" data-v="mono">素色</button><button class="c" data-v="topic">主題</button><button class="c" data-v="age">新舊</button><button class="c" data-v="fade">快忘</button></div>
 <div class="g m" id="gPick"></div>

 <span class="m" id="legend"></span>
 <div class="g"><button class="c" id="linesBtn">線 ▾</button><button class="c" id="demoBtn">顯示示範點</button></div>
</div>
<div id="linePanel" hidden>
 <b class="m">平常顯示（放大到知識點時）</b>
 <label class="m"><input type="checkbox" data-g="norm" data-k="in"> 同主題的關聯</label>
 <label class="m"><input type="checkbox" data-g="norm" data-k="x"> 跨主題的關聯</label>
 <b>點選知識點時顯示</b>
 <label class="m"><input type="checkbox" data-g="sel" data-k="s"> 結構線</label>
 <label><input type="checkbox" data-g="sel" data-k="in"> 同主題的關聯</label>

 <div id="cbody"></div>
</aside>
<script src="data/knowledge-data.js"></script>
<script>
// ===== 基本工具 =====
const K=window.KNOWLEDGE;
const rng=seed=>{let s=seed|0;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const sm=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)};
const backOut=t=>{t-=1;return 1+2.7*t*t*t+1.7*t*t};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('kn.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('kn.'+k,JSON.stringify(v))}catch(e){}}};
const mix=(a,b,k)=>{const h=x=>[1,3,5].map(i=>parseInt(x.substr(i,2),16)),A=h(a),B=h(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`};
const rgbOf=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)).join(',');

// ===== 設定（所有選單的選擇都會記住）=====
const DEF={mode:'star',bg:'dark',col:'mono',demo:true,starC:'#FFF1C9',starHi:'#FFFFFF',accent:'#9B7BFF',mono:{dark:'#C9CCD1',light:'#45484E'},age:['#FFB020','#5B6B8C'],fade:['#7CE0B5','#E07A7A'],tcol:{},
 lines:{norm:{s:true,in:true,x:false},sel:{s:true,in:true,x:true}}};
const SV=store.get('settings',{});
const st=Object.assign(JSON.parse(JSON.stringify(DEF)),SV);
st.lines={norm:{...DEF.lines.norm,...(SV.lines?.norm||{})},sel:{...DEF.lines.sel,...(SV.lines?.sel||{})}};
const save=()=>store.set('settings',st);
const KNX={label:p=>p.name,fs:1,lw:1,la:1,dash:[],lineCol:null,dmp:.6,ms:1000}; // 編輯台（edit.js）會改這些
const view={z:1,cx:0,cy:0,sel:null};
const PAL=['#6EA8FF','#FF8FB1','#5FE0C1','#FFC46B','#C9A2FF','#8FD3FF','#F7A072'];
const TEX=['band','swirl','moon','spots','shade'];

// ===== 把資料變成主題、子主題、知識點 =====
let TP=[],S=[],adj={},byId={},REAL=0,FIT={star:{},min:{}};
let NODES=[],HUBS=[],EDGES=[],simA=0,simT=0,tr=1,tr0=0;
function lum(tp,x,y,z,cr){let l=.55+.45*(-.5*x-.4*y+.77*z);
 if(tp==='moon')cr.forEach(c=>{const d=Math.hypot(x-c.x,y-c.y);if(d<c.r)l*=.4;else if(d<c.r*1.25)l=Math.min(1,l+.25)});
 if(tp==='band')l*=.5+.5*Math.sin(y*10+Math.sin(x*4)*.8);
 if(tp==='swirl')l*=.5+.5*Math.sin(5*Math.atan2(y,x)+Math.hypot(x,y)*9);
 if(tp==='spots')cr.forEach(c=>{if(Math.hypot(x-c.x,y-c.y)<c.r*1.3)l*=.35});
 return Math.max(.18,Math.min(1,l))}
const bbox=(items,f)=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;items.forEach(o=>{const[x,y,r]=f(o);x0=Math.min(x0,x-r);x1=Math.max(x1,x+r);y0=Math.min(y0,y-r);y1=Math.max(y1,y+r)});return{wc:{x:(x0+x1)/2,y:(y0+y1)/2},bw:x1-x0,bh:y1-y0}};
function build(){
 const R=rng(11);
 const tops=K.topics.filter(t=>!t.parent).map(t=>({...t,subs:K.topics.filter(s=>s.parent===t.id).map(s=>({...s})),pts:[]}));
 const subOf={};tops.forEach((T,ti)=>T.subs.forEach((s,si)=>subOf[s.id]=[ti,si]));
 const sd={};K.sources.forEach(s=>sd[s.id]=Date.parse(s.date));
 const pts=K.points.filter(p=>subOf[p.topic]).map(p=>{const[ti,si]=subOf[p.topic];const created=Math.min(...p.src.map(id=>sd[id]));return{...p,t:ti,sub:si,n:p.src.length,created,seenAt:p.seen?Date.parse(p.seen):created,demo:false}});
 REAL=pts.length;
 if(st.demo){const DR=rng(7),now=Date.now();
  tops.push({id:'demoA',name:'示範主題 A',demo:true,subs:[{name:''},{name:''},{name:''}],pts:[]},{id:'demoB',name:'示範主題 B',demo:true,subs:[{name:''},{name:''}],pts:[]});
  const extra=[240,170,420,70,14];let k=0;
  tops.forEach((T,ti)=>{for(let i=0;i<(extra[ti]??40);i++){const r=DR(),n=r<.75?1:r<.9?2:2+Math.ceil(DR()*4),created=now-DR()*400*864e5;
   pts.push({id:'d'+k++,name:'',t:ti,sub:Math.floor(DR()*T.subs.length),n,created,seenAt:created+DR()*(now-created),demo:true})}})}
 pts.forEach(p=>tops[p.t].pts.push(p));
 const cs=pts.map(p=>p.created),mn=Math.min(...cs),mx=Math.max(...cs),now=Date.now(),smx=Math.max(1,...pts.map(p=>now-p.seenAt));
 pts.forEach(p=>{p.age=mx>mn?(mx-p.created)/(mx-mn):0;p.seen=(now-p.seenAt)/smx;p.imp=.2+.8*Math.min(1,(p.n-1)/5);p.h=0;p.g=0});
 tops.forEach((T,ti)=>{
  const N=Math.max(1,T.pts.length);T.r0=22*Math.pow(N,.35);T.s=T.r0/95;T.boost=1+1.5*(1-Math.min(1,T.pts.length/120));T.tex=T.tex||TEX[ti%TEX.length];T.col=st.tcol[T.id]||T.color||PAL[ti%PAL.length];
  const cr=[0,1,2,3,4].map(()=>({x:R()*1.3-.65,y:R()*1.3-.65,r:.12+R()*.18}));
  const P=[];let g=0;while(P.length<T.pts.length&&g++<4e5){const a=R()*6.283,rr=Math.sqrt(R()),x=Math.cos(a)*rr,y=Math.sin(a)*rr,z=Math.sqrt(1-rr*rr),l=lum(T.tex,x,y,z,cr);if(R()<Math.pow(l,1.3))P.push({x:x*T.r0,y:y*T.r0,rr,l})}
  P.sort((a,b)=>a.rr-b.rr);
  T.pts.sort((a,b)=>b.n-a.n||(a.demo-b.demo)||(a.id<b.id?-1:1));
  T.subP=T.subs.map((_,k)=>{const a=k/T.subs.length*6.283+R()*.6;return{x:Math.cos(a)*190*T.s,y:Math.sin(a)*190*T.s}});
  const M=T.pts.length;
  T.pts.forEach((p,i)=>{const q=P[i];p.pk={x:q.x,y:q.y};p.lum=q.l;const an=Math.atan2(q.y,q.x),gr=Math.sqrt((i+.5)/M)*1.8*T.r0;p.bloom={x:Math.cos(an)*gr,y:Math.sin(an)*gr};
   const sp=T.subP[p.sub],gs=()=>(R()+R()+R()-1.5)*55*T.s;p.scat={x:sp.x+gs(),y:sp.y+gs()}})});
 // 星空：大的放中間，其他往外排，彼此不重疊
 const placed=[];[...tops].sort((a,b)=>b.r0-a.r0).forEach((T,k)=>{T.ext=3.3*T.r0;
  if(!placed.length){T.x=0;T.y=0;placed.push(T);return}
  for(let d=40;;d+=40){let ok=false;for(let a=0;a<16&&!ok;a++){const an=a/16*6.283+k*2.4,x=Math.cos(an)*d,y=Math.sin(an)*d*.75;
   if(placed.every(o=>Math.hypot(o.x-x,o.y-y)>o.ext+T.ext+60)){T.x=x;T.y=y;ok=true}}if(ok)break}placed.push(T)});
 FIT.star=bbox(tops,T=>[T.x,T.y,T.ext]);
 TP=tops;S=pts;byId={};S.forEach(p=>{byId[p.id]=p;const T=TP[p.t];p.sx=T.x;p.sy=T.y;p.svx=p.svy=0});
 adj={};K.links.forEach(l=>{const a=byId[l.a],b=byId[l.b];if(!a||!b)return;const x=a.t!==b.t;(adj[a.id]=adj[a.id]||[]).push({p:b,note:l.note,x});(adj[b.id]=adj[b.id]||[]).push({p:a,note:l.note,x})});
 initMin();
 bandK='';buildBand();rs();home(false);
}

// ===== 簡約（開放式）：主題 → 子主題 → 知識點，放大才出現下一層；點有 Obsidian 式的流動 =====
function repel(arr,fx,fy,a){for(const n of arr)for(const m of arr){if(m===n)continue;let dx=m[fx]-n[fx],dy=m[fy]-n[fy],l2=dx*dx+dy*dy;if(l2>8100)continue;if(l2<1){dx=Math.random()-.5;dy=Math.random()-.5;l2=1}const w=-30*a/l2;n.mvx+=dx*w;n.mvy+=dy*w}}
function initMin(){const R=rng(3);EDGES=[];dragT=null;
 TP.forEach(T=>{T.hub=true;
  T.subs.forEach(s=>{s.T=T;s.hub=true;s.pts=T.pts.filter(p=>T.subs[p.sub]===s);const n=s.pts.length;
   s.pts.forEach(p=>{const a=R()*6.283,r=Math.sqrt(-2*Math.log(1-R()*.97))*(Math.sqrt(n)*4.2+3);p.lx=Math.cos(a)*r;p.ly=Math.sin(a)*r;p.mvx=p.mvy=0});
   let a=.35;for(let it=0;it<40;it++){a*=.95;repel(s.pts,'lx','ly',a);for(const q of s.pts){q.mvx-=q.lx*.06*a;q.mvy-=q.ly*.06*a;q.lx+=q.mvx*=.6;q.ly+=q.mvy*=.6}}
   const ds=s.pts.map(q=>Math.hypot(q.lx,q.ly)).sort((a,b)=>a-b);s.rS=Math.max(12,ds[Math.floor(ds.length*.9)]||0)+6});
  const k=T.subs.length,mr=Math.max(...T.subs.map(s=>s.rS));let rho=0;
  if(k>1){for(let i=0;i<k;i++){const A=T.subs[i],B=T.subs[(i+1)%k];rho=Math.max(rho,(A.rS+B.rS+40)/(2*Math.sin(Math.PI/k)))}rho=Math.max(rho,mr+45)}
  T.subs.forEach((s,i)=>{const an=i/k*6.283-1.5708;s.ox=Math.cos(an)*rho;s.oy=Math.sin(an)*rho});T.mext=rho+mr+30});
 const placed=[];[...TP].sort((a,b)=>b.mext-a.mext).forEach((T,k)=>{
  if(!placed.length){T.mx=0;T.my=0;placed.push(T);return}
  for(let d=40;;d+=30){let ok=false;for(let a=0;a<16&&!ok;a++){const an=a/16*6.283+k*2.4,x=Math.cos(an)*d,y=Math.sin(an)*d*.8;
   if(placed.every(o=>Math.hypot(o.mx-x,o.my-y)>o.mext+T.mext+20)){T.mx=x;T.my=y;ok=true}}if(ok)break}placed.push(T)});
 TP.forEach(T=>T.subs.forEach(s=>{s.cx=T.mx+s.ox;s.cy=T.my+s.oy;s.pts.forEach(p=>{p.mx=s.cx+p.lx;p.my=s.cy+p.ly;p.mvx=p.mvy=0;const g=()=>(R()+R()+R()-1.5)*14;p.cx0=T.mx+s.ox*.3+p.lx*.8+g();p.cy0=T.my+s.oy*.3+p.ly*.8+g()})}));
 S.forEach(p=>(adj[p.id]||[]).forEach(r=>{if(p.id<r.p.id&&!r.x)EDGES.push({a:p,b:r.p,L:30,k:.02})}));
 simA=0;simT=0;FIT.min=bbox(TP,T=>[T.mx,T.my,T.mext])}
let dragN=null,dragW=[0,0],dragT=null;
function tick(){simA+=(simT-simA)*.0228;const a=simA,C=90,g=new Map();
 for(const e of EDGES){const A=e.a,B=e.b;let dx=B.mx+B.mvx-A.mx-A.mvx,dy=B.my+B.mvy-A.my-A.mvy,l=Math.hypot(dx,dy)||1e-3;l=(l-e.L)/l*a*e.k;dx*=l;dy*=l;B.mvx-=dx*.5;B.mvy-=dy*.5;A.mvx+=dx*.5;A.mvy+=dy*.5}
 const AC=dragT?dragT.pts:S;for(const n of AC){const key=Math.floor(n.mx/C)*65536+Math.floor(n.my/C);let c=g.get(key);if(!c)g.set(key,c=[]);c.push(n)}
 for(const n of AC){const gx=Math.floor(n.mx/C),gy=Math.floor(n.my/C);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const c=g.get((gx+i)*65536+gy+j);if(!c)continue;
   for(const m of c){if(m===n)continue;let dx=m.mx-n.mx,dy=m.my-n.my,l2=dx*dx+dy*dy;if(l2>C*C)continue;if(l2<1){dx=Math.random()-.5;dy=Math.random()-.5;l2=1}const w=-30*a/l2;n.mvx+=dx*w;n.mvy+=dy*w}}}
 for(const n of AC){if(n===dragN){n.mx=dragW[0];n.my=dragW[1];n.mvx=n.mvy=0;continue}const sb=TP[n.t].subs[n.sub];n.mvx-=(n.mx-sb.cx)*.03*a;n.mvy-=(n.my-sb.cy)*.03*a;n.mx+=n.mvx*=KNX.dmp;n.my+=n.mvy*=KNX.dmp}}
const mm=()=>Math.min(W,H),extR=T=>T.mext*base*view.z/mm();
const subA=T=>sm(.38,.5,extR(T)),ptA=T=>sm(.9,1.3,extR(T)),nmA=T=>sm(1.2,1.6,extR(T));

// ===== 星空模式的彈簧：每顆星被拉回自己在星球上的位置 =====
let dragS=null;
const zFor=T=>.32*Math.min(W,H)/(T.r0*base);
const ttOf=T=>sm(.16,.26,T.r0*base*view.z/Math.min(W,H));
function starHome(p){const T=TP[p.t],tt=ttOf(T);return[T.x+p.pk.x+(p.bloom.x-p.pk.x)*tt,T.y+p.pk.y+(p.bloom.y-p.pk.y)*tt]}
function starTarget(p){if(dragS){if(p===dragS.p)return[dragS.wx,dragS.wy];const w=dragS.w.get(p);if(w){const[x,y]=starHome(p);return[x+dragS.ox*w,y+dragS.oy*w]}}return starHome(p)}
function stepStar(){let act=false;const px=base*view.z;
 for(const p of S){const[tx,ty]=starTarget(p);p.svx=(p.svx+(tx-p.sx)*.05)*KNX.dmp;p.svy=(p.svy+(ty-p.sy)*.05)*KNX.dmp;p.sx+=p.svx;p.sy+=p.svy;
  if((Math.abs(p.svx)+Math.abs(p.svy))*px>.04||(Math.abs(tx-p.sx)+Math.abs(ty-p.sy))*px>.08)act=true;else{p.sx=tx;p.sy=ty;p.svx=p.svy=0}}
 return act}
function startStarDrag(p){const T=TP[p.t],[hx,hy]=starHome(p),sg=1.6*1.8*T.r0*Math.sqrt(Math.PI/T.pts.length),w=new Map();
 T.pts.forEach(q=>{if(q===p)return;const[x,y]=starHome(q),d2=(x-hx)**2+(y-hy)**2,v=Math.exp(-d2/(2*sg*sg))*.3;if(v>.03)w.set(q,v)});
 dragS={p,w,hx,hy,wx:hx,wy:hy,ox:0,oy:0}}

// ===== 畫面位置 =====

 const spread=Math.max(0,...TP.map(ttOf)),zb=1+(view.z-1)*.12,s2=base*zb,bx=W/2+(-BW/2-(view.cx-wc.x)*.25)*s2,by=H/2+(-BH/2-(view.cy-wc.y)*.25)*s2;

  const sp=TP[p.t].pts.length<120?1:0;ctx.globalAlpha=((sp?.6:.22)+(sp?.4:.78)*a)*(st.col==='fade'?1-p.seen*.7:1)*(1-.75*dim*(1-p.h));ctx.beginPath();ctx.arc(x,y,((sp?1.6:.9)+a*(.5+p.imp*2.4))*(1+.7*p.g),0,6.283);ctx.fill()}

 if(view.sel&&F===view.sel){ctx.globalAlpha=1;ctx.font=`${12*KNX.fs}px system-ui`;const[x0,y0]=toS(...pos(F));relOf(F).forEach(r=>{const[x,y]=toS(...pos(r.p)),mx=(x0+x)/2,my=(y0+y)/2,tw=ctx.measureText(r.note).width;ctx.fillStyle=lt?'#fffd':'#000d';ctx.fillRect(mx-tw/2-4,my-11,tw+8,16);ctx.fillStyle=fg;ctx.fillText(r.note,mx,my+1)})}

function home(a=true){const f=FIT[st.mode];ZMAX=st.mode==='star'?Math.max(20,...TP.map(zFor))*1.6:Math.max(14,...TP.map(T=>2.4*mm()/(T.mext*base)));if(a)anim(1,f.wc.x,f.wc.y);else{view.z=1;view.cx=f.wc.x;view.cy=f.wc.y;zs.value=0;dirty=true}}

[['gMode','mode'],['gBg','bg'],['gCol','col']].forEach(([id,k])=>document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('.c');if(!b)return;const ch=k==='mode'&&st.mode!==b.dataset.v;st[k]=b.dataset.v;save();ui();if(ch)enterMode()}));
['starC','starHi','accent'].forEach(id=>document.getElementById(id).oninput=e=>{st[id]=e.target.value;save();dirty=true});
document.getElementById('linesBtn').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();linePanel.style.left=Math.min(r.left,W-300)+'px';linePanel.style.top=(r.bottom+6)+'px';linePanel.hidden=!linePanel.hidden};
linePanel.onchange=e=>{const i=e.target;st.lines[i.dataset.g][i.dataset.k]=i.checked;save();dirty=true};
document.getElementById('demoBtn').onclick=()=>{st.demo=!st.demo;save();view.sel=null;hover=null;tip.style.display='none';card.hidden=true;build();ui();enterMode()};
document.getElementById('home').onclick=()=>{view.sel=null;tip.style.display='none';home()};
build();ui();enterMode();requestAnimationFrame(frame);
</script>
